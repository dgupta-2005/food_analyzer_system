<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Food Analyzer — UML Architecture Diagrams (B&W HD)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 20px;
    }
    .header {
      text-align: center;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 26px;
      font-weight: 700;
      color: #000000;
      margin-bottom: 6px;
    }
    p {
      color: #475569;
      font-size: 14px;
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      background: #ffffff;
      padding: 6px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
    }
    .tab-btn {
      padding: 10px 24px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 14px;
      color: #475569;
      background: transparent;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: #000000;
      color: #ffffff;
    }
    .actions {
      display: flex;
      gap: 14px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 14px;
      text-decoration: none;
      cursor: pointer;
      border: 1.5px solid #000000;
      background: #000000;
      color: #ffffff;
      transition: all 0.15s ease;
    }
    .btn:hover {
      background: #333333;
    }
    .diagram-panel {
      display: none;
      width: 100%;
      max-width: 1400px;
      background: #ffffff;
      border: 1.5px solid #000000;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    }
    .diagram-panel.active {
      display: block;
    }
    .diagram-panel object {
      width: 100%;
      height: auto;
      min-height: 800px;
      display: block;
      border: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Food Analyzer System — UML Architecture Diagrams</h1>
    <p>Standard High-Resolution Black & White UML Diagrams for Documentation</p>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="showTab('usecase')">1. Use Case Diagram</button>
    <button class="tab-btn" onclick="showTab('sequence')">2. Sequence Diagram</button>
  </div>

  <!-- Panel 1: Use Case -->
  <div id="panel-usecase" class="diagram-panel active">
    <div class="actions">
      <a href="use_case_diagram.svg" download="UML_Use_Case_Diagram_HD.svg" class="btn">
        ⬇️ Download Use Case Diagram (HD SVG)
      </a>
    </div>
    <object data="use_case_diagram.svg" type="image/svg+xml"></object>
  </div>

  <!-- Panel 2: Sequence -->
  <div id="panel-sequence" class="diagram-panel">
    <div class="actions">
      <a href="sequence_diagram.svg" download="UML_Sequence_Diagram_HD.svg" class="btn">
        ⬇️ Download Sequence Diagram (HD SVG)
      </a>
    </div>
    <object data="sequence_diagram.svg" type="image/svg+xml"></object>
  </div>

  <script>
    function showTab(name) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.diagram-panel').forEach(p => p.classList.remove('active'));
      
      if (name === 'usecase') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('panel-usecase').classList.add('active');
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('panel-sequence').classList.add('active');
      }
    }
  </script>
</body>
</html>
