<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 950" width="100%" height="100%" style="background:#0f172a; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    
    <!-- Marker for Transitions -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24" />
    </marker>
  </defs>

  <!-- Title Banner -->
  <rect x="40" y="25" width="1120" height="60" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <text x="600" y="62" fill="#ffffff" font-size="20" font-weight="700" text-anchor="middle" letter-spacing="0.5">
    UML STATE MACHINE DIAGRAM — FOOD ANALYZER APPLICATION LIFECYCLE
  </text>

  <!-- Initial State (Black Circle) -->
  <circle cx="90" cy="150" r="14" fill="#38bdf8" stroke="#ffffff" stroke-width="2" />
  
  <!-- Transition to LoggedOut -->
  <line x1="104" y1="150" x2="160" y2="150" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />
  <text x="132" y="142" fill="#94a3b8" font-size="11" font-weight="600" text-anchor="middle">Launch</text>

  <!-- State 1: Unauthenticated / Guest -->
  <g transform="translate(170, 120)">
    <rect x="0" y="0" width="190" height="65" rx="12" fill="#1e293b" stroke="#64748b" stroke-width="2" filter="url(#shadow)" />
    <text x="95" y="28" fill="#f8fafc" font-size="13" font-weight="700" text-anchor="middle">Unauthenticated</text>
    <text x="95" y="48" fill="#94a3b8" font-size="11" text-anchor="middle">entry / show AuthPage</text>
  </g>

  <!-- Transition: Submit Credentials -->
  <line x1="360" y1="150" x2="440" y2="150" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />
  <text x="400" y="142" fill="#38bdf8" font-size="11" font-weight="600" text-anchor="middle">login(email, pass)</text>

  <!-- State 2: Authenticating -->
  <g transform="translate(450, 120)">
    <rect x="0" y="0" width="170" height="65" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="2" filter="url(#shadow)" />
    <text x="85" y="28" fill="#f8fafc" font-size="13" font-weight="700" text-anchor="middle">Authenticating</text>
    <text x="85" y="48" fill="#fbbf24" font-size="11" text-anchor="middle">do / verify JWT token</text>
  </g>

  <!-- Transition: Invalid Credentials (Loop back) -->
  <path d="M 535 120 C 535 90, 265 90, 265 120" fill="none" stroke="#ef4444" stroke-width="1.8" marker-end="url(#arrow)" stroke-dasharray="4,3" />
  <text x="400" y="82" fill="#f87171" font-size="11" font-weight="600" text-anchor="middle">[invalid credentials] / display error</text>

  <!-- Transition: Valid Credentials -> Authenticated Composite State -->
  <line x1="620" y1="150" x2="700" y2="150" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrow-emerald)" />
  <text x="660" y="142" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">[token valid]</text>

  <!-- ==================== COMPOSITE STATE: AUTHENTICATED SESSION ==================== -->
  <rect x="50" y="220" width="1100" height="630" rx="16" fill="#131e36" stroke="#2563eb" stroke-width="2.5" filter="url(#shadow)" />
  <rect x="50" y="220" width="1100" height="40" rx="16" fill="#1e3a8a" />
  <rect x="50" y="246" width="1100" height="14" fill="#1e3a8a" />
  <text x="80" y="246" fill="#ffffff" font-size="15" font-weight="700">
    STATE: Authenticated Session (NutriVision Active State)
  </text>
  <text x="1060" y="246" fill="#93c5fd" font-size="12" text-anchor="end">
    entry / loadUserProfile(), fetchTodayCalories()
  </text>

  <!-- Internal Initial State inside Authenticated Session -->
  <circle cx="100" cy="300" r="10" fill="#38bdf8" />
  <line x1="110" y1="300" x2="160" y2="300" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Substate: Dashboard Idle -->
  <g transform="translate(170, 265)">
    <rect x="0" y="0" width="220" height="75" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)" />
    <text x="110" y="26" fill="#f8fafc" font-size="14" font-weight="700" text-anchor="middle">Dashboard / Active Idle</text>
    <text x="110" y="46" fill="#94a3b8" font-size="11" text-anchor="middle">display: target vs consumed kcal</text>
    <text x="110" y="62" fill="#94a3b8" font-size="11" text-anchor="middle">render: macro progress rings</text>
  </g>

  <!-- Substate: AI Meal Estimator Mode -->
  <g transform="translate(100, 395)">
    <rect x="0" y="0" width="310" height="230" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="2" filter="url(#shadow)" />
    <text x="155" y="26" fill="#34d399" font-size="13" font-weight="700" text-anchor="middle">AI Meal Estimation Sub-LifeCycle</text>
    <line x1="15" y1="36" x2="295" y2="36" stroke="#334155" stroke-width="1" />
    
    <!-- Step 1: Input Ready -->
    <rect x="25" y="50" width="260" height="36" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1.2" />
    <text x="155" y="73" fill="#e2e8f0" font-size="11.5" text-anchor="middle">AwaitingPhotoOrDescription</text>

    <!-- Arrow down -->
    <line x1="155" y1="86" x2="155" y2="108" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arrow)" />
    <text x="160" y="100" fill="#94a3b8" font-size="9.5" text-anchor="start">submitMeal()</text>

    <!-- Step 2: Gemini AI Analysis -->
    <rect x="25" y="112" width="260" height="42" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5" />
    <text x="155" y="130" fill="#fbbf24" font-size="12" font-weight="600" text-anchor="middle">GeminiMultimodalAnalyzing</text>
    <text x="155" y="146" fill="#94a3b8" font-size="10" text-anchor="middle">do / fallback [2.5-flash -> 1.5-flash]</text>

    <!-- Arrow down -->
    <line x1="155" y1="154" x2="155" y2="176" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arrow)" />

    <!-- Step 3: Breakdown Review & Log -->
    <rect x="25" y="180" width="260" height="38" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1.5" />
    <text x="155" y="198" fill="#34d399" font-size="11.5" font-weight="600" text-anchor="middle">NutritionEstimatesReviewed</text>
    <text x="155" y="212" fill="#94a3b8" font-size="10" text-anchor="middle">exit / logMealToDatabase()</text>
  </g>

  <!-- Transition: Dashboard to Meal Estimator -->
  <path d="M 230 340 L 230 395" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-emerald)" />
  <text x="235" y="370" fill="#34d399" font-size="11" font-weight="600">selectTab("estimator")</text>

  <!-- Transition: Meal Estimator Back to Dashboard -->
  <path d="M 330 395 C 360 360, 360 350, 330 340" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />
  <text x="365" y="370" fill="#38bdf8" font-size="10.5" font-weight="600">onMealLogged() / refresh</text>


  <!-- Substate: Packaged Food & Barcode Scanner -->
  <g transform="translate(450, 395)">
    <rect x="0" y="0" width="310" height="230" rx="14" fill="#1e293b" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)" />
    <text x="155" y="26" fill="#fbbf24" font-size="13" font-weight="700" text-anchor="middle">Packaged Scanner Sub-LifeCycle</text>
    <line x1="15" y1="36" x2="295" y2="36" stroke="#334155" stroke-width="1" />

    <!-- Step 1: Scan or Search -->
    <rect x="25" y="50" width="260" height="36" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1.2" />
    <text x="155" y="73" fill="#e2e8f0" font-size="11.5" text-anchor="middle">AwaitingBarcodeOrQuery</text>

    <!-- Arrow down -->
    <line x1="155" y1="86" x2="155" y2="108" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arrow)" />
    <text x="160" y="100" fill="#94a3b8" font-size="9.5" text-anchor="start">scanImage() / search()</text>

    <!-- Step 2: ZXing + OpenFoodFacts Query -->
    <rect x="25" y="112" width="260" height="42" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5" />
    <text x="155" y="130" fill="#fbbf24" font-size="12" font-weight="600" text-anchor="middle">ResolvingOpenFoodFacts</text>
    <text x="155" y="146" fill="#94a3b8" font-size="10" text-anchor="middle">do / decode barcode &amp; fetch Nutri-Score</text>

    <!-- Arrow down -->
    <line x1="155" y1="154" x2="155" y2="176" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arrow)" />

    <!-- Step 3: Product Comparison & Save -->
    <rect x="25" y="180" width="260" height="38" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <text x="155" y="198" fill="#38bdf8" font-size="11.5" font-weight="600" text-anchor="middle">Comparison &amp; CollectionMode</text>
    <text x="155" y="212" fill="#94a3b8" font-size="10" text-anchor="middle">saveHealthyAlternative()</text>
  </g>

  <!-- Transition: Dashboard to Barcode/Compare -->
  <path d="M 390 310 C 490 310, 520 340, 520 395" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow-amber)" />
  <text x="510" y="340" fill="#fbbf24" font-size="11" font-weight="600">selectTab("barcode" / "compare")</text>


  <!-- Substate: AI Diet & Macro Planner -->
  <g transform="translate(800, 395)">
    <rect x="0" y="0" width="310" height="230" rx="14" fill="#1e293b" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow)" />
    <text x="155" y="26" fill="#a78bfa" font-size="13" font-weight="700" text-anchor="middle">AI Diet Planner Sub-LifeCycle</text>
    <line x1="15" y1="36" x2="295" y2="36" stroke="#334155" stroke-width="1" />

    <!-- Step 1: Evaluating Profile -->
    <rect x="25" y="50" width="260" height="36" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1.2" />
    <text x="155" y="73" fill="#e2e8f0" font-size="11.5" text-anchor="middle">EvaluatingProfile&amp;History</text>

    <!-- Arrow down -->
    <line x1="155" y1="86" x2="155" y2="108" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arrow)" />

    <!-- Step 2: Synthesizing Plan -->
    <rect x="25" y="112" width="260" height="42" rx="8" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.5" />
    <text x="155" y="130" fill="#c084fc" font-size="12" font-weight="600" text-anchor="middle">SynthesizingCalorieSlots</text>
    <text x="155" y="146" fill="#94a3b8" font-size="10" text-anchor="middle">do / allocate target calories &amp; dishes</text>

    <!-- Arrow down -->
    <line x1="155" y1="154" x2="155" y2="176" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arrow)" />

    <!-- Step 3: Plan Active -->
    <rect x="25" y="180" width="260" height="38" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1.5" />
    <text x="155" y="202" fill="#34d399" font-size="12" font-weight="600" text-anchor="middle">PersonalizedPlanActive</text>
  </g>

  <!-- Transition: Dashboard to Diet Planner -->
  <path d="M 390 280 C 680 260, 880 290, 880 395" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow)" />
  <text x="730" y="280" fill="#c084fc" font-size="11" font-weight="600">selectTab("planner")</text>

  <!-- Substate: Profile Settings Modal (Bottom) -->
  <g transform="translate(300, 680)">
    <rect x="0" y="0" width="320" height="70" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.8" filter="url(#shadow)" />
    <text x="160" y="26" fill="#f8fafc" font-size="13" font-weight="700" text-anchor="middle">Editing Health Profile (Modal)</text>
    <text x="160" y="46" fill="#94a3b8" font-size="11" text-anchor="middle">update: weight, height, activity level, goal</text>
    <text x="160" y="60" fill="#38bdf8" font-size="10" text-anchor="middle">recalculates TDEE / BMR macros</text>
  </g>

  <!-- Substate: Meal History Viewer (Bottom Right) -->
  <g transform="translate(680, 680)">
    <rect x="0" y="0" width="320" height="70" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.8" filter="url(#shadow)" />
    <text x="160" y="26" fill="#f8fafc" font-size="13" font-weight="700" text-anchor="middle">Inspecting Meal History Logs</text>
    <text x="160" y="46" fill="#94a3b8" font-size="11" text-anchor="middle">do / query SQLite logs with items breakdown</text>
    <text x="160" y="60" fill="#94a3b8" font-size="10" text-anchor="middle">filter by date / meal type</text>
  </g>

  <!-- Logout Transition to Final State -->
  <line x1="1050" y1="220" x2="1050" y2="150" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow)" />
  <text x="1055" y="185" fill="#f87171" font-size="11" font-weight="600">logout()</text>

  <!-- Final State (Bullseye) -->
  <circle cx="1050" cy="120" r="14" fill="none" stroke="#ef4444" stroke-width="2.5" />
  <circle cx="1050" cy="120" r="8" fill="#ef4444" />
  <text x="1050" y="96" fill="#f87171" font-size="11" font-weight="700" text-anchor="middle">Terminated</text>

  <!-- Legend -->
  <g transform="translate(50, 890)">
    <rect x="0" y="0" width="1100" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="25" y="26" fill="#f8fafc" font-size="12" font-weight="700">NOTATION LEGEND:</text>
    <circle cx="170" cy="21" r="7" fill="#38bdf8"/>
    <text x="185" y="25" fill="#94a3b8" font-size="11">Initial State</text>
    <circle cx="280" cy="21" r="7" fill="none" stroke="#ef4444" stroke-width="2"/>
    <circle cx="280" cy="21" r="4" fill="#ef4444"/>
    <text x="295" y="25" fill="#94a3b8" font-size="11">Final State</text>
    <rect x="380" y="13" width="22" height="16" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="410" y="25" fill="#94a3b8" font-size="11">State / Substate</text>
    <line x1="530" y1="21" x2="560" y2="21" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="570" y="25" fill="#94a3b8" font-size="11">State Transition</text>
    <rect x="680" y="13" width="24" height="16" rx="4" fill="#131e36" stroke="#2563eb" stroke-width="2"/>
    <text x="712" y="25" fill="#94a3b8" font-size="11">Composite / Superstate</text>
  </g>
</svg>
