<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1250" width="100%" height="100%" style="background:#ffffff; font-family:'Arial', 'Segoe UI', sans-serif;">
  <defs>
    <!-- Solid Black Arrowhead for Synchronous Call -->
    <marker id="arrow-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#000000" />
    </marker>
    <!-- Open Arrowhead for Return Call -->
    <marker id="arrow-return" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <polyline points="1,1 9,5 1,9" fill="none" stroke="#000000" stroke-width="2" />
    </marker>
  </defs>

  <!-- ==================== HEADER ==================== -->
  <rect x="40" y="25" width="1520" height="70" rx="4" fill="#ffffff" stroke="#000000" stroke-width="2" />
  <text x="800" y="68" fill="#000000" font-size="24" font-weight="bold" text-anchor="middle" letter-spacing="0.5">
    UML SEQUENCE DIAGRAM — MULTIMODAL AI MEAL ESTIMATION &amp; LOGGING
  </text>

  <!-- ==================== PARTICIPANTS / LIFELINES ==================== -->
  
  <!-- 1. Actor: User -->
  <g transform="translate(120, 130)">
    <rect x="-65" y="0" width="130" height="52" rx="4" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
    <text x="0" y="32" fill="#000000" font-size="16" font-weight="bold" text-anchor="middle">👤 User</text>
    <line x1="0" y1="52" x2="0" y2="1050" stroke="#000000" stroke-width="1.8" stroke-dasharray="8,6"/>
  </g>

  <!-- 2. Boundary: React Frontend -->
  <g transform="translate(340, 130)">
    <rect x="-95" y="0" width="190" height="52" rx="4" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
    <text x="0" y="22" fill="#555555" font-size="12" font-style="italic" text-anchor="middle">&lt;&lt;Boundary&gt;&gt;</text>
    <text x="0" y="42" fill="#000000" font-size="15" font-weight="bold" text-anchor="middle">React (MealEstimator)</text>
    <line x1="0" y1="52" x2="0" y2="1050" stroke="#000000" stroke-width="1.8" stroke-dasharray="8,6"/>
  </g>

  <!-- 3. Controller: FastAPI -->
  <g transform="translate(590, 130)">
    <rect x="-95" y="0" width="190" height="52" rx="4" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
    <text x="0" y="22" fill="#555555" font-size="12" font-style="italic" text-anchor="middle">&lt;&lt;Controller&gt;&gt;</text>
    <text x="0" y="42" fill="#000000" font-size="15" font-weight="bold" text-anchor="middle">FastAPI (/api/v1/meals)</text>
    <line x1="0" y1="52" x2="0" y2="1050" stroke="#000000" stroke-width="1.8" stroke-dasharray="8,6"/>
  </g>

  <!-- 4. Service: StorageService -->
  <g transform="translate(830, 130)">
    <rect x="-85" y="0" width="170" height="52" rx="4" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
    <text x="0" y="22" fill="#555555" font-size="12" font-style="italic" text-anchor="middle">&lt;&lt;Service&gt;&gt;</text>
    <text x="0" y="42" fill="#000000" font-size="15" font-weight="bold" text-anchor="middle">StorageService</text>
    <line x1="0" y1="52" x2="0" y2="1050" stroke="#000000" stroke-width="1.8" stroke-dasharray="8,6"/>
  </g>

  <!-- 5. Service: GeminiService -->
  <g transform="translate(1060, 130)">
    <rect x="-85" y="0" width="170" height="52" rx="4" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
    <text x="0" y="22" fill="#555555" font-size="12" font-style="italic" text-anchor="middle">&lt;&lt;Service&gt;&gt;</text>
    <text x="0" y="42" fill="#000000" font-size="15" font-weight="bold" text-anchor="middle">GeminiService</text>
    <line x1="0" y1="52" x2="0" y2="1050" stroke="#000000" stroke-width="1.8" stroke-dasharray="8,6"/>
  </g>

  <!-- 6. External: Google Gemini API -->
  <g transform="translate(1280, 130)">
    <rect x="-95" y="0" width="190" height="52" rx="4" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
    <text x="0" y="22" fill="#555555" font-size="12" font-style="italic" text-anchor="middle">&lt;&lt;External System&gt;&gt;</text>
    <text x="0" y="42" fill="#000000" font-size="15" font-weight="bold" text-anchor="middle">Google Gemini API</text>
    <line x1="0" y1="52" x2="0" y2="1050" stroke="#000000" stroke-width="1.8" stroke-dasharray="8,6"/>
  </g>

  <!-- 7. Database: SQLite DB -->
  <g transform="translate(1480, 130)">
    <rect x="-75" y="0" width="150" height="52" rx="4" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
    <text x="0" y="22" fill="#555555" font-size="12" font-style="italic" text-anchor="middle">&lt;&lt;Database&gt;&gt;</text>
    <text x="0" y="42" fill="#000000" font-size="15" font-weight="bold" text-anchor="middle">SQLite DB</text>
    <line x1="0" y1="52" x2="0" y2="1050" stroke="#000000" stroke-width="1.8" stroke-dasharray="8,6"/>
  </g>

  <!-- ==================== ACTIVATION BARS & INTERACTIONS ==================== -->

  <!-- User Lifeline Bar -->
  <rect x="113" y="215" width="14" height="800" fill="#ffffff" stroke="#000000" stroke-width="1.8" />

  <!-- 1. User -> React -->
  <line x1="127" y1="230" x2="331" y2="230" stroke="#000000" stroke-width="2" marker-end="url(#arrow-sync)" />
  <text x="230" y="220" fill="#000000" font-size="14.5" font-weight="bold" text-anchor="middle">1: selectFile(photo) &amp; inputNotes()</text>

  <!-- React Activation -->
  <rect x="333" y="230" width="14" height="770" fill="#ffffff" stroke="#000000" stroke-width="1.8" />

  <!-- 2. React -> FastAPI -->
  <line x1="347" y1="265" x2="581" y2="265" stroke="#000000" stroke-width="2" marker-end="url(#arrow-sync)" />
  <text x="465" y="255" fill="#000000" font-size="14" font-weight="bold" text-anchor="middle">2: POST /api/v1/meals/estimate (FormData)</text>

  <!-- FastAPI Activation (Estimate) -->
  <rect x="583" y="265" width="14" height="375" fill="#ffffff" stroke="#000000" stroke-width="1.8" />

  <!-- 3. FastAPI -> StorageService -->
  <line x1="597" y1="295" x2="821" y2="295" stroke="#000000" stroke-width="2" marker-end="url(#arrow-sync)" />
  <text x="710" y="285" fill="#000000" font-size="14" text-anchor="middle">3: save_upload_file(image)</text>

  <!-- StorageService Activation -->
  <rect x="823" y="295" width="14" height="45" fill="#ffffff" stroke="#000000" stroke-width="1.8" />

  <!-- 4. StorageService -> FastAPI -->
  <line x1="823" y1="335" x2="597" y2="335" stroke="#000000" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrow-return)" />
  <text x="710" y="325" fill="#000000" font-size="13.5" text-anchor="middle">4: return saved_image_path</text>

  <!-- 5. FastAPI -> GeminiService -->
  <line x1="597" y1="375" x2="1051" y2="375" stroke="#000000" stroke-width="2.2" marker-end="url(#arrow-sync)" />
  <text x="825" y="365" fill="#000000" font-size="14.5" font-weight="bold" text-anchor="middle">5: estimate_meal(image_path, description)</text>

  <!-- GeminiService Activation -->
  <rect x="1053" y="375" width="14" height="225" fill="#ffffff" stroke="#000000" stroke-width="1.8" />

  <!-- ==================== LOOP / FALLBACK COMBINED FRAGMENT ==================== -->
  <rect x="990" y="405" width="365" height="165" fill="#fafafa" stroke="#000000" stroke-width="1.8" stroke-dasharray="6,4" />
  
  <rect x="990" y="405" width="180" height="26" fill="#f0f0f0" stroke="#000000" stroke-width="1.5" />
  <text x="1080" y="422" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">loop [for model in FALLBACKS]</text>

  <!-- 6. GeminiService -> Google Gemini API -->
  <line x1="1067" y1="460" x2="1271" y2="460" stroke="#000000" stroke-width="2" marker-end="url(#arrow-sync)" />
  <text x="1170" y="450" fill="#000000" font-size="13" font-weight="bold" text-anchor="middle">6: generate_content(contents, schema)</text>

  <!-- External API Activation -->
  <rect x="1273" y="460" width="14" height="80" fill="#ffffff" stroke="#000000" stroke-width="1.8" />

  <!-- 7. Google Gemini API -> GeminiService -->
  <line x1="1273" y1="520" x2="1067" y2="520" stroke="#000000" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrow-return)" />
  <text x="1170" y="510" fill="#000000" font-size="13" text-anchor="middle">7: return JSON(AIStructuredMealResponse)</text>

  <!-- 8. GeminiService -> FastAPI -->
  <line x1="1053" y1="590" x2="597" y2="590" stroke="#000000" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrow-return)" />
  <text x="825" y="580" fill="#000000" font-size="14" text-anchor="middle">8: return AIStructuredMealResponse DTO</text>

  <!-- 9. FastAPI -> React -->
  <line x1="583" y1="630" x2="347" y2="630" stroke="#000000" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-return)" />
  <text x="465" y="620" fill="#000000" font-size="14" font-weight="bold" text-anchor="middle">9: HTTP 200 OK (Calories, Macros, Itemized Breakdown)</text>

  <!-- 10. React -> User -->
  <line x1="333" y1="670" x2="127" y2="670" stroke="#000000" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrow-return)" />
  <text x="230" y="660" fill="#000000" font-size="14" text-anchor="middle">10: renderNutrientBreakdownCard()</text>

  <!-- ==================== USER LOGS MEAL TO DATABASE ==================== -->

  <!-- 11. User confirms -->
  <line x1="127" y1="720" x2="331" y2="720" stroke="#000000" stroke-width="2" marker-end="url(#arrow-sync)" />
  <text x="230" y="710" fill="#000000" font-size="14.5" font-weight="bold" text-anchor="middle">11: click "Log Meal to History"</text>

  <!-- 12. React -> FastAPI Log -->
  <line x1="347" y1="755" x2="581" y2="755" stroke="#000000" stroke-width="2" marker-end="url(#arrow-sync)" />
  <text x="465" y="745" fill="#000000" font-size="14" font-weight="bold" text-anchor="middle">12: POST /api/v1/meals/log (MealLogCreateDTO)</text>

  <!-- FastAPI Re-activation (Log Meal) -->
  <rect x="583" y="755" width="14" height="200" fill="#ffffff" stroke="#000000" stroke-width="1.8" />

  <!-- 13. FastAPI -> SQLite DB -->
  <line x1="597" y1="790" x2="1471" y2="790" stroke="#000000" stroke-width="2.2" marker-end="url(#arrow-sync)" />
  <text x="1034" y="780" fill="#000000" font-size="14.5" font-weight="bold" text-anchor="middle">13: db.add(MealLog) with linked items &amp; commit()</text>

  <!-- Database Activation -->
  <rect x="1473" y="790" width="14" height="70" fill="#ffffff" stroke="#000000" stroke-width="1.8" />

  <!-- 14. DB -> FastAPI -->
  <line x1="1473" y1="845" x2="597" y2="845" stroke="#000000" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrow-return)" />
  <text x="1034" y="835" fill="#000000" font-size="13.5" text-anchor="middle">14: commit success (meal_id=42, status="persisted")</text>

  <!-- 15. FastAPI -> React -->
  <line x1="583" y1="895" x2="347" y2="895" stroke="#000000" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-return)" />
  <text x="465" y="885" fill="#000000" font-size="14" font-weight="bold" text-anchor="middle">15: HTTP 201 Created (MealLogResponse)</text>

  <!-- 16. React -> User -->
  <line x1="333" y1="940" x2="127" y2="940" stroke="#000000" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-return)" />
  <text x="230" y="930" fill="#000000" font-size="14" font-weight="bold" text-anchor="middle">16: showSuccessToast() &amp; refreshTodayCalories()</text>

  <!-- ==================== NOTATION LEGEND (BLACK & WHITE) ==================== -->
  <g transform="translate(60, 1145)">
    <rect x="0" y="0" width="1480" height="60" rx="4" fill="#fcfcfc" stroke="#000000" stroke-width="1.5"/>
    <text x="30" y="35" fill="#000000" font-size="14" font-weight="bold">UML NOTATION LEGEND:</text>

    <!-- Sync Message -->
    <line x1="240" y1="30" x2="300" y2="30" stroke="#000000" stroke-width="2" marker-end="url(#arrow-sync)"/>
    <text x="310" y="35" fill="#000000" font-size="13.5">Synchronous Request</text>

    <!-- Return Message -->
    <line x1="550" y1="30" x2="610" y2="30" stroke="#000000" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrow-return)"/>
    <text x="620" y="35" fill="#000000" font-size="13.5">Return / Reply Message</text>

    <!-- Activation Bar -->
    <rect x="880" y="20" width="14" height="22" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
    <text x="905" y="35" fill="#000000" font-size="13.5">Execution Occurrence (Activation)</text>

    <!-- Combined Fragment -->
    <rect x="1210" y="20" width="30" height="20" fill="#fafafa" stroke="#000000" stroke-width="1.5" stroke-dasharray="4,2"/>
    <text x="1250" y="35" fill="#000000" font-size="13.5">Combined Fragment (Loop)</text>
  </g>
</svg>
